# L'image nginx-unprivileged tourne sans root : elle ne peut donc pas écouter
# sur le port 80, on écoute sur 8080.
server {
    listen       8080;
    # Nom de domaine du site, http://msemen.localhost fonctionne sans configurer de DNS.
    server_name  msemen.localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Page HTML : jamais en cache, pour voir tout de suite les nouvelles versions
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
