- name: Destroy msemen-ui
  hosts: localhost
  connection: local
  become: true
  vars:
    app_dir: /opt/msemen-ui
    remove_data: false
    remove_certs: false
    purge: false
    confirm: ""
    do_data: "{{ purge | bool or remove_data | bool }}"
    do_certs: "{{ purge | bool or remove_certs | bool }}"

  tasks:
    - name: Refuse destructive options without confirmation
      assert:
        that: not (do_data or do_certs) or confirm == 'yes'
        fail_msg: "Option destructive : ajoute -e confirm=yes"
        quiet: true

    - name: Check the app folder
      stat:
        path: "{{ app_dir }}/docker-compose.prod.yml"
      register: app

    - name: Stop and remove the application containers
      command: docker compose -f docker-compose.prod.yml down --remove-orphans
      args:
        chdir: "{{ app_dir }}"
      environment:
        DOMAIN: "{{ domain | default('unused') }}"
      when: app.stat.exists

    - name: Remove the database and Matomo volumes
      command: docker volume rm -f msemen_db_data msemen_matomo_data
      when: do_data

    - name: Remove the TLS certificate
      command: certbot delete --cert-name msemen --non-interactive
      failed_when: false
      when: do_certs

    - name: Stop the registry and remove its images
      command: docker compose down -v
      args:
        chdir: "{{ app_dir }}/registry"
      when: purge | bool and app.stat.exists

    - name: Remove the msemen images
      shell: docker images --format '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}' | grep '/msemen/' | xargs -r docker rmi -f
      when: purge | bool

    - name: Remove the application files and generated passwords
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ app_dir }}"
        - /root/.msemen_db_password
        - /root/.msemen_db_root_password
      when: purge | bool
