- name: Deploy msemen-ui
  hosts: localhost
  connection: local
  become: true
  vars:
    app_dir: /opt/msemen-ui
    repo: https://github.com/Wassim-Moumine/msemen-ui.git
    domain: ""
    certbot_email: ""
    tls_staging: false
    duckdns_token: ""

  tasks:
    - name: Check the domain variable
      assert:
        that: domain | length > 0
        fail_msg: "Domaine manquant. Exemple : -e domain=monnom.duckdns.org"
        quiet: true

    - name: Install the required packages
      apt:
        name: [docker.io, docker-compose-v2, git, curl, certbot]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Create a swap file on small VMs
      shell: |
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args:
        creates: /swapfile
      when: ansible_memtotal_mb < 1500

    - name: Clone or update the repo
      git:
        repo: "{{ repo }}"
        dest: "{{ app_dir }}"
        version: main
        force: true

    - name: Create the secrets folder
      file:
        path: "{{ app_dir }}/secrets"
        state: directory
        mode: "0700"

    - name: Generate the database passwords
      copy:
        dest: "{{ app_dir }}/secrets/{{ item }}.txt"
        content: "{{ lookup('password', '/root/.msemen_' + item + ' length=24 chars=ascii_letters,digits') }}"
        mode: "0600"
        force: false
      loop: [db_password, db_root_password]
      no_log: true

    - name: Write the .env file
      copy:
        dest: "{{ app_dir }}/.env"
        mode: "0644"
        content: |
          DOMAIN={{ domain }}

    - name: Get the public IP of the VM
      uri:
        url: https://api.ipify.org
        return_content: true
      register: public_ip

    - name: Point the DuckDNS name to this VM
      command: curl -sS "https://www.duckdns.org/update?domains={{ domain | regex_replace('\\.duckdns\\.org$', '') }}&token={{ duckdns_token }}&ip={{ public_ip.content | trim }}"
      register: duckdns
      failed_when: false
      changed_when: false
      no_log: true
      when: duckdns_token | length > 0

    - name: Check the DuckDNS answer
      assert:
        that: duckdns.stdout | trim == 'OK'
        fail_msg: "DuckDNS a répondu '{{ duckdns.stdout | trim }}' (code {{ duckdns.rc }}) {{ duckdns.stderr | default('') }}. KO = token ou nom de domaine incorrect."
        quiet: true
      when: duckdns_token | length > 0

    - name: Wait until the domain names point to this VM
      command: getent hosts {{ item }}.{{ domain }}
      register: dns
      until: public_ip.content in dns.stdout
      retries: 30
      delay: 10
      changed_when: false
      loop: [msemen, analytics]

    - name: Start the private registry
      command: docker compose up -d
      args:
        chdir: "{{ app_dir }}/registry"
      changed_when: false

    - name: Wait for the registry
      uri:
        url: http://localhost:5000/v2/
      register: registry_up
      until: registry_up.status == 200
      retries: 12
      delay: 5

    - name: Check the TLS certificate
      stat:
        path: /etc/letsencrypt/live/msemen/fullchain.pem
      register: cert

    - name: Free port 80 before asking for the certificate
      command: docker stop msemen-proxy-1
      failed_when: false
      changed_when: false
      when: not cert.stat.exists

    - name: Get the certificate from Let's Encrypt
      command: >
        certbot certonly --standalone --non-interactive --agree-tos
        --cert-name msemen -d msemen.{{ domain }} -d analytics.{{ domain }}
        {{ '--email ' + certbot_email if certbot_email | length > 0 else '--register-unsafely-without-email' }}
        {{ '--staging' if tls_staging | bool else '' }}
      when: not cert.stat.exists

    - name: Create the certbot hook folders
      file:
        path: "/etc/letsencrypt/renewal-hooks/{{ item }}"
        state: directory
      loop: [pre, post]

    - name: Stop and start the proxy around each certificate renewal
      copy:
        dest: "/etc/letsencrypt/renewal-hooks/{{ item.when }}/msemen.sh"
        mode: "0755"
        content: |
          #!/bin/sh
          docker {{ item.action }} msemen-proxy-1
      loop:
        - { when: pre, action: stop }
        - { when: post, action: start }

    - name: Build the images and publish them to the registry
      command: sh publish.sh
      args:
        chdir: "{{ app_dir }}"

    - name: Pull the images from the registry
      command: docker compose -f docker-compose.prod.yml pull
      args:
        chdir: "{{ app_dir }}"

    - name: Start the stack
      command: docker compose -f docker-compose.prod.yml up -d --remove-orphans
      args:
        chdir: "{{ app_dir }}"

    - name: Remove unused images
      command: docker image prune -f
      changed_when: false

    - name: Check the site over HTTPS
      uri:
        url: "https://msemen.{{ domain }}/"
        validate_certs: "{{ not (tls_staging | bool) }}"
      register: site
      until: site.status == 200
      retries: 12
      delay: 5
      ignore_errors: true

    - name: Show the result
      debug:
        msg:
          - "Site   : https://msemen.{{ domain }} ({{ 'répond' if site is not failed else 'ne répond pas depuis la VM, voir : docker compose -f docker-compose.prod.yml logs proxy' }})"
          - "Matomo : https://analytics.{{ domain }}"
