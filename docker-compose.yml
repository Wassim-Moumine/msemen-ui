services:
  msemen-ui:
    build: .                    
    image: msemen-ui:1.0        
    container_name: msemen-ui
    ports:
      - "80:8080"               # port 80 de la machine (port web par défaut) -> 8080 du conteneur
    restart: unless-stopped     # redémarre automatiquement si le conteneur plante
    read_only: true            
    tmpfs:                      
      - /tmp
      - /var/cache/nginx
