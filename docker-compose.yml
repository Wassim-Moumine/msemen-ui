services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=msemen-front
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)
      - traefik.http.routers.dashboard.entrypoints=web
      - traefik.http.routers.dashboard.service=api@internal
    security_opt:
      - no-new-privileges:true
    networks:
      - front

  msemen-ui:
    build: .
    image: msemen-ui:1.0
    container_name: msemen-ui
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - traefik.enable=true
      - traefik.http.routers.msemen.rule=Host(`msemen.localhost`)
      - traefik.http.routers.msemen.entrypoints=web
      - traefik.http.services.msemen.loadbalancer.server.port=8080
    networks:
      - front

  db:
    image: postgres:17-alpine
    container_name: mattermost-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - back

  mattermost:
    image: mattermost/mattermost-team-edition:10.11
    container_name: mattermost
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: ${MM_SITEURL}
    volumes:
      - mm-config:/mattermost/config
      - mm-data:/mattermost/data
      - mm-logs:/mattermost/logs
      - mm-plugins:/mattermost/plugins
      - mm-client-plugins:/mattermost/client/plugins
    labels:
      - traefik.enable=true
      - traefik.http.routers.mattermost.rule=Host(`mattermost.localhost`)
      - traefik.http.routers.mattermost.entrypoints=web
      - traefik.http.services.mattermost.loadbalancer.server.port=8065
    security_opt:
      - no-new-privileges:true
    networks:
      - front
      - back

  monitor:
    image: "curlimages/curl:latest"
    container_name: msemen-monitor
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/check.sh"]
    environment:
      TZ: Europe/Paris
      TARGET_URL: http://msemen-ui:8080/health
      WEBHOOK_URL: http://mattermost:8065/hooks/${MM_WEBHOOK_KEY}
      INTERVAL: "30"
    volumes:
      - ./monitor/check.sh:/check.sh:ro
    depends_on:
      - mattermost
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - front

networks:
  front:
    name: msemen-front
  back:
    internal: true

volumes:
  db-data:
  mm-config:
  mm-data:
  mm-logs:
  mm-plugins:
  mm-client-plugins: